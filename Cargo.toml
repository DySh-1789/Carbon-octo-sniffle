[workspace]
resolver = "3"
members = [
    "crates/voxel",
    "crates/sim",
    "crates/game",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

# Keep dependencies fast in debug mode so Bevy 3D runs smoothly during development
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
